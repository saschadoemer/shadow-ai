# Serves dist/ from the container (ops.md §2). The unprivileged nginx image includes this file
# inside its http block, which is why `map` can sit at the top level here.

# index.html and every other unhashed file are revalidated on each visit; Vite's hashed files
# under /assets/ never change, so they are cached for a year.
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # On every response, 404 included (`always`). Set once at server level: a location with its
    # own add_header would stop inheriting these, so no location below has one.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $cache_control always;

    # The page.
    location = / {
        try_files /index.html =404;
    }

    # A directory is not a file.
    location ~ ^/.+/$ {
        return 404;
    }

    # Everything else is a file or a 404. There is no fallback to index.html: the game is one
    # page, not a routed application.
    location / {
        try_files $uri =404;
    }
}
